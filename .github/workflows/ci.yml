name: CI

on:
  push:
    branches:
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.QQPET_SIGNING_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Use the phone's signing key when configured
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.QQPET_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QQPET_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QQPET_SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qqpet.jks"
          {
            echo "QQPET_SIGN_STORE_FILE=$RUNNER_TEMP/qqpet.jks"
            echo "QQPET_SIGN_STORE_PASSWORD=$STORE_PASSWORD"
            echo "QQPET_SIGN_KEY_ALIAS=$KEY_ALIAS"
            echo "QQPET_SIGN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qqpet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
