name: CI

on:
  push:
    branches:
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.QQPET_SIGNING_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The runner image ships an Android SDK; setup-android@v3 fails on its legacy 'tools' package.
      - name: Install Android 36 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Use the phone's signing key when configured
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.QQPET_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QQPET_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QQPET_SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qqpet.jks"
          {
            echo "QQPET_SIGN_STORE_FILE=$RUNNER_TEMP/qqpet.jks"
            echo "QQPET_SIGN_STORE_PASSWORD=$STORE_PASSWORD"
            echo "QQPET_SIGN_KEY_ALIAS=$KEY_ALIAS"
            echo "QQPET_SIGN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Summarize failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              suite = ET.parse(f).getroot()
              for case in suite.iter('testcase'):
                  total += 1
                  bad = case.find('failure') if case.find('failure') is not None else case.find('error')
                  if bad is not None:
                      failed += 1
                      msg = (bad.get('message') or bad.text or '').strip().splitlines()
                      print(f"FAILED {case.get('classname')}.{case.get('name')}: {msg[0][:300] if msg else ''}")
          print(f"SUMMARY {failed} failed of {total}")
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qqpet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
